name: Télécharger les vignettes Colonna
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vignettes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les vignettes
        run: sh scripts/telecharger-vignettes.sh
      - name: Enregistrer les images dans le dépôt
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add images/colonna/rubriques
          git diff --cached --quiet && echo "Rien à enregistrer" && exit 0
          git commit -m "Vignettes Colonna téléchargées en local"
          git push
