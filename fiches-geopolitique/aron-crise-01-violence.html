<h1 class="sr-only">Étape 1 sur 4 : La violence a-t-elle augmenté ?</h1>
<div class="scene"><object type="image/svg+xml" data="images/aron-crise/01-violence.svg" aria-label="La violence a-t-elle augmenté ?">La violence est endémique dans l&#x27;histoire. Rien ne prouve qu&#x27;il y ait plus d&#x27;attentats ou d&#x27;assassinats qu&#x27;il y a cinquante ans : même les villages d&#x27;autrefois étaient violents. Certaines formes sont nouvelles (otages, violence politique). Mais les suicides n&#x27;ont pas augmenté : la formule de Durkheim, « plus de suicides, donc crise », serait fausse.</object></div>
