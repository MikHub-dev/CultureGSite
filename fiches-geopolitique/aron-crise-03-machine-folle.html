<h1 class="sr-only">Étape 3 sur 4 : Une civilisation rationalisée qui pèse</h1>
<div class="scene"><object type="image/svg+xml" data="images/aron-crise/03-machine-folle.svg" aria-label="Une civilisation rationalisée qui pèse">Marx disait que la protestation romantique accompagnerait le capitalisme jusqu&#x27;à sa mort. Aron l&#x27;étend : elle accompagnera toute civilisation rationalisée, capitaliste ou socialiste. Chacun se sent prisonnier d&#x27;un mécanisme anonyme où personne ne décide : une « machine folle » qui produit des millions de voitures pour une circulation impossible.</object></div>
