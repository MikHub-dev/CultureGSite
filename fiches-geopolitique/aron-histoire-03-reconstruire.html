<h1 class="sr-only">Étape 3 sur 6 : L&#x27;histoire reconstruit, elle ne reproduit pas</h1>
<div class="scene"><object type="image/svg+xml" data="images/aron-histoire/03-reconstruire.svg" aria-label="L&#x27;histoire reconstruit, elle ne reproduit pas">On ne retrouve jamais le passé « tel qu&#x27;il s&#x27;est réellement passé » (Ranke). Rickert : l&#x27;esprit choisit le singulier selon des valeurs. Dilthey : l&#x27;objet est humain, on le comprend. Weber concilie les deux : l&#x27;historien choisit librement son objet, puis la preuve causale doit valoir pour tous. Et la part du jugement varie selon l&#x27;objet étudié.</object></div>
