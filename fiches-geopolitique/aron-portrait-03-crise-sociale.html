<h1 class="sr-only">Étape 3 sur 6 : Y a-t-il une crise de la société ?</h1>
<div class="scene"><object type="image/svg+xml" data="images/aron-portrait/03-crise-sociale.svg" aria-label="Y a-t-il une crise de la société ?">Rien ne prouve que la violence ait augmenté, même si certaines formes sont nouvelles. Mais les sociétés qui proclament l&#x27;égalité sans la réaliser créent de la frustration. Chacun se sent pris dans une « machine folle » que personne ne dirige. Aron distingue trois horizons de la crise : 5-8 ans, un demi-siècle, et l&#x27;utopie d&#x27;une civilisation stationnaire.</object></div>
