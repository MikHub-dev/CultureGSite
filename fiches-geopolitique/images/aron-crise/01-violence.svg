;autrefois</text><text x="390" y="412" font-size="15" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Il y a 50 ans</text><text x="640" y="412" font-size="15" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1974</text><text x="380" y="254" font-size="17" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Pas de preuve d&#x27;une hausse</text><text x="380" y="466" font-size="18" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Mais des formes nouvelles</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.080;0.140;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="72" y="484" width="174" height="36" rx="18" fill="#ff6b7a" fill-opacity=".14" stroke="#ff6b7a"/><text x="159" y="508" font-size="17" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Prises d&#x27;otages</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.260;0.320;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="264" y="484" width="203" height="36" rx="18" fill="#ff6b7a" fill-opacity=".14" stroke="#ff6b7a"/><text x="365" y="508" font-size="17" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Violence politique</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.440;0.500;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="485" y="484" width="174" height="36" rx="18" fill="#ff6b7a" fill-opacity=".14" stroke="#ff6b7a"/><text x="572" y="508" font-size="17" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Beaux quartiers</text></g><rect x="750" y="180" width="470" height="380" rx="14" fill="#f2b84b" fill-opacity=".05" stroke="#f2b84b" stroke-width="2"/><text x="985" y="214" font-size="20" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Le test des suicides</text><text x="985" y="270" font-size="20" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">« Plus de suicides,</text><text x="985" y="298" font-size="20" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">donc la société est</text><text x="985" y="326" font-size="20" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">en crise » (Durkheim)</text><line x1="800" y1="330" x2="1170" y2="250" stroke="#ff6b7a" stroke-width="4" stroke-dasharray="380" stroke-dashoffset="380"><animate attributeName="stroke-dashoffset" values="380;380;0;0;380" keyTimes="0;0.30;0.40;.92;1" dur="9s" repeatCount="indefinite"/></line><rect x="850" y="400" width="44" height="70" rx="4" fill="#7aa2ff" fill-opacity=".55"/><rect x="930" y="398" width="44" height="72" rx="4" fill="#7aa2ff" fill-opacity=".55"/><rect x="1010" y="401" width="44" height="69" rx="4" fill="#7aa2ff" fill-opacity=".55"/><rect x="1090" y="399" width="44" height="71" rx="4" fill="#7aa2ff" fill-opacity=".55"/><line x1="830" y1="470" x2="1150" y2="470" stroke="#9fb3d6"/><text x="985" y="500" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Le nombre de suicides n&#x27;a pas bougé</text><text x="985" y="522" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">en cinquante ans : la formule est fausse</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">La violence est endémique dans l&#x27;histoire. Rien ne prouve qu&#x27;il</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">y ait plus d&#x27;attentats ou d&#x27;assassinats qu&#x27;il y a cinquante ans</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">: même les villages d&#x27;autrefois étaient violents.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Certaines formes sont nouvelles (otages, violence politique).</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Mais les suicides n&#x27;ont pas augmenté : la formule de Durkheim, «</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">plus de suicides, donc crise », serait fausse.</text></svg>
