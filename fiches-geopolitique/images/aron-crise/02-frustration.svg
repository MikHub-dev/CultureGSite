t-size="16" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">ÉTAPE 02 / 04</text><circle cx="1142" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1168" cy="52" r="8" fill="#f2b84b" fill-opacity="1" stroke="#f2b84b"/><circle cx="1194" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1220" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><text x="640" y="118" font-size="40" fill="#e6eefc" text-anchor="middle" font-weight="600" font-family="Spectral, Georgia, &#x27;Times New Roman&#x27;, serif">Tant de biens à la vue de tous</text><text x="640" y="152" font-size="19" fill="#5ad1e6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Pourquoi certaines formes de criminalité sont propres aux sociétés qui se veulent égalitaires</text><rect x="60" y="180" width="520" height="380" rx="14" fill="#7aa2ff" fill-opacity=".05" stroke="#7aa2ff" stroke-width="2"/><text x="320" y="214" font-size="21" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Sous Louis XIV</text><rect x="90" y="250" width="200" height="150" rx="14" fill="#f2b84b" fill-opacity=".12" stroke="#f2b84b" stroke-width="2"/><text x="190" y="310" font-size="19" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">La cour</text><text x="190" y="336" font-size="19" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">de Louis XIV</text><rect x="350" y="250" width="200" height="150" rx="14" fill="#7ee0a0" fill-opacity=".12" stroke="#7ee0a0" stroke-width="2"/><text x="450" y="310" font-size="19" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Les</text><text x="450" y="336" font-size="19" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">paysans</text><rect x="312" y="236" width="16" height="180" fill="#9fb3d6" fill-opacity=".7"/><text x="320" y="450" font-size="17" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Deux mondes séparés :</text><text x="320" y="474" font-size="17" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">la hiérarchie est acceptée,</text><text x="320" y="498" font-size="17" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">peu de frustration</text><rect x="620" y="180" width="600" height="380" rx="14" fill="#ff6b7a" fill-opacity=".05" stroke="#ff6b7a" stroke-width="2"/><text x="920" y="214" font-size="21" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">En 1974</text><rect x="660" y="240" width="330" height="120" rx="10" fill="#5ad1e6" fill-opacity=".1" stroke="#5ad1e6" stroke-dasharray="6 5"/><text x="825" y="262" font-size="16" fill="#5ad1e6" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Des biens visibles par tous</text><rect x="676" y="280" width="66" height="60" rx="8" fill="#f2b84b" fill-opacity=".25"/><text x="709" y="316" font-size="14" fill="#f2b84b" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">voiture</text><rect x="753" y="280" width="66" height="60" rx="8" fill="#f2b84b" fill-opacity=".25"/><text x="786" y="316" font-size="14" fill="#f2b84b" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">télé</text><rect x="830" y="280" width="66" height="60" rx="8" fill="#f2b84b" fill-opacity=".25"/><text x="863" y="316" font-size="14" fill="#f2b84b" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">vacances</text><rect x="907" y="280" width="66" height="60" rx="8" fill="#f2b84b" fill-opacity=".25"/><text x="940" y="316" font-size="14" fill="#f2b84b" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">maison</text><circle cx="679" cy="414" r="8" fill="#9fb3d6"/><circle cx="703" cy="414" r="8" fill="#9fb3d6"/><circle cx="726" cy="400" r="8" fill="#7ee0a0" filter="url(#glow)"/><path d="M726 392 V366" stroke="#7ee0a0" stroke-width="2" marker-end="url(#fl)"/><circle cx="744" cy="414" r="8" fill="#9fb3d6"/><circle cx="767" cy="414" r="8" fill="#9fb3d6"/><circle cx="786" cy="414" r="8" fill="#9fb3d6"/><circle cx="809" cy="414" r="8" fill="#9fb3d6"/><circle cx="832" cy="414" r="8" fill="#9fb3d6"/><circle cx="855" cy="414" r="8" fill="#9fb3d6"/><circle cx="882" cy="400" r="8" fill="#7ee0a0" filter="url(#glow)"/><path d="M882 392 V366" stroke="#7ee0a0" stroke-width="2" marker-end="url(#fl)"/><circle cx="899" cy="414" r="8" fill="#9fb3d6"/><circle cx="924" cy="414" r="8" fill="#9fb3d6"/><circle cx="940" cy="414" r="8" fill="#9fb3d6"/><circle cx="969" cy="414" r="8" fill="#9fb3d6"/><text x="825" y="446" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Beaucoup regardent, peu accèdent</text><text x="1110" y="250" font-size="16" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Frustration</text><rect x="1090" y="262" width="40" height="200" rx="8" fill="none" stroke="#ff6b7a" stroke-width="2"/><rect x="1094" y="300" width="32" height="158" rx="6" fill="#ff6b7a" fill-opacity=".7"><animate attributeName="y" values="440;300;300;440" keyTimes="0;.5;.9;1" dur="9s" repeatCount="indefinite"/><animate attributeName="height" values="18;158;158;18" keyTimes="0;.5;.9;1" dur="9s" repeatCount="indefinite"/></rect><text x="920" y="490" font-size="17" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Égalité proclamée, inégalité des conditions</text><text x="920" y="514" font-size="17" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">→ certaines formes de criminalité</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Peu de sociétés ont montré autant de biens à tous leurs membres</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">tout en empêchant tant d&#x27;entre eux de les acquérir. La petite</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">criminalité (vols de voitures) en découle en partie.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">La cour de Louis XIV et les paysans vivaient dans deux mondes</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">séparés : la hiérarchie était acceptée. Aujourd&#x27;hui, l&#x27;égalité</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">proclamée rend l&#x27;inégalité des conditions insupportable.</text></svg>
