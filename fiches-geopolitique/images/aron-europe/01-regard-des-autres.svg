x="14" fill="#ff6b7a" fill-opacity=".12" stroke="#ff6b7a" stroke-width="2"/><circle cx="106" cy="222" r="20" fill="#ff6b7a" fill-opacity=".16" stroke="#ff6b7a" stroke-width="2.5"/><text x="106" y="229.92" font-size="22" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Spectral, Georgia, &#x27;Times New Roman&#x27;, serif">A</text><text x="138" y="230" font-size="22" fill="#ff6b7a" text-anchor="start" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Journal extrémiste</text><text x="92" y="272" font-size="18" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Haine du communisme,</text><text x="92" y="298" font-size="18" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">défense du grand capital,</text><text x="92" y="324" font-size="18" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">« idéologue de l&#x27;impérialisme »</text><path d="M245 360 L640 393" stroke="#ff6b7a" stroke-width="2" stroke-dasharray="6 6" fill="none"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.300;0.360;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="465" y="185" width="350" height="175" rx="14" fill="#7aa2ff" fill-opacity=".12" stroke="#7aa2ff" stroke-width="2"/><circle cx="501" cy="222" r="20" fill="#7aa2ff" fill-opacity=".16" stroke="#7aa2ff" stroke-width="2.5"/><text x="501" y="229.92" font-size="22" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Spectral, Georgia, &#x27;Times New Roman&#x27;, serif">B</text><text x="533" y="230" font-size="22" fill="#7aa2ff" text-anchor="start" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Gauche modérée</text><text x="487" y="272" font-size="18" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Lucide, mais peu sensible</text><text x="487" y="298" font-size="18" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">à la douleur humaine,</text><text x="487" y="324" font-size="18" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">des causes discutables</text><path d="M640 360 L640 393" stroke="#7aa2ff" stroke-width="2" stroke-dasharray="6 6" fill="none"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.560;0.620;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="860" y="185" width="350" height="175" rx="14" fill="#7ee0a0" fill-opacity=".12" stroke="#7ee0a0" stroke-width="2"/><circle cx="896" cy="222" r="20" fill="#7ee0a0" fill-opacity=".16" stroke="#7ee0a0" stroke-width="2.5"/><text x="896" y="229.92" font-size="22" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Spectral, Georgia, &#x27;Times New Roman&#x27;, serif">C</text><text x="928" y="230" font-size="22" fill="#7ee0a0" text-anchor="start" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Un ami</text><text x="882" y="272" font-size="18" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Un libéral isolé, comme</text><text x="882" y="298" font-size="18" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Montesquieu et Tocqueville :</text><text x="882" y="324" font-size="18" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">ni révolution, ni réaction</text><path d="M1035 360 L640 393" stroke="#7ee0a0" stroke-width="2" stroke-dasharray="6 6" fill="none"/></g><text x="640" y="552" font-size="18" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">« Mon testament politique, ou l&#x27;éloge funèbre rédigé par mes amis ou mes ennemis ? »</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Pierre Dumayet lui demande son testament politique. Aron</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">commence par imaginer trois éloges funèbres : un journal</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">extrémiste, un journal de gauche modérée, un ami.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Pour l&#x27;ami, il partage le sort des libéraux français : ne</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">rejoindre ni la révolution sans idée, ni la conservation sans</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">cœur, et rester seul.</text></svg>
