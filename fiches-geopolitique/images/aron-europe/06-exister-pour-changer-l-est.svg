;, system-ui, sans-serif">à court terme ; et si l&#x27;Ouest entrait dans le système</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">soviétique, la tyrannie serait pire.</text></svg>
