y="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">une fin :</text><text x="250" y="429" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">la société sans classes</text></g><path d="M640 297 C640 330 640 320 640 350" fill="none" stroke="#5ad1e6" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.170;0.230;0.920;1" dur="9s" repeatCount="indefinite"/></path><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.220;0.280;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="505" y="352" width="270" height="96" rx="14" fill="#5ad1e6" fill-opacity=".1" stroke="#5ad1e6" stroke-width="2"/><text x="640" y="382" font-size="20" fill="#5ad1e6" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Historicisme</text><text x="640" y="408" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">pas de fin :</text><text x="640" y="429" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">tout est relatif</text></g><path d="M640 297 C640 330 1030 320 1030 350" fill="none" stroke="#ff6b7a" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.290;0.350;0.920;1" dur="9s" repeatCount="indefinite"/></path><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.340;0.400;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="895" y="352" width="270" height="96" rx="14" fill="#ff6b7a" fill-opacity=".1" stroke="#ff6b7a" stroke-width="2"/><text x="1030" y="382" font-size="20" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Existentialisme</text><text x="1030" y="408" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">la conscience seule,</text><text x="1030" y="429" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">« passion inutile »</text></g><g><animateTransform attributeName="transform" type="rotate" values="-6 640 500;6 640 500;-6 640 500" dur="7s" repeatCount="indefinite"/><line x1="330" y1="500" x2="950" y2="500" stroke="#9fb3d6" stroke-width="3"/><text x="330" y="490" font-size="17" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Un sens : Hegel, Marx</text><text x="950" y="490" font-size="17" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Un non-sens : Shakespeare</text></g><path d="M640 500 l-16 32 h32z" fill="#9fb3d6" fill-opacity=".5"/><text x="640" y="556" font-size="16" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">« Un récit fait par un idiot, plein de bruit et de fureur, qui ne signifie rien »</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Pour Burckhardt, philosophie et histoire s&#x27;excluent ; pour</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Croce, l&#x27;histoire est la philosophie. Deux réactions à Hegel,</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">pour qui l&#x27;histoire est la raison qui se réalise.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Ses héritiers : le marxisme (une fin, la société sans classes),</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">l&#x27;historicisme (pas de fin), l&#x27;existentialisme (la conscience</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">seule). Ou le « récit d&#x27;un idiot » de Shakespeare ?</text></svg>
