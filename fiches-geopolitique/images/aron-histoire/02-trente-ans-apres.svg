sans-serif">Brunschvicg :</text><text x="170" y="368" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">le néo-kantisme</text><circle cx="490" cy="250" r="16" fill="#0e1228" stroke="#ff6b7a" stroke-width="3"/><text x="490" y="216" font-size="20" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1931-1933</text><rect x="365" y="285" width="250" height="105" rx="14" fill="#ff6b7a" fill-opacity=".08" stroke="#ff6b7a" stroke-width="2"/><text x="490" y="318" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Une Allemagne</text><text x="490" y="343" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">« doublement</text><text x="490" y="368" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">historiciste »</text><circle cx="810" cy="250" r="16" fill="#0e1228" stroke="#f2b84b" stroke-width="3"/><text x="810" y="216" font-size="20" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1945-1956</text><rect x="685" y="285" width="250" height="105" rx="14" fill="#f2b84b" fill-opacity=".08" stroke="#f2b84b" stroke-width="2"/><text x="810" y="318" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Débat avec Sartre</text><text x="810" y="343" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">et Merleau-Ponty :</text><text x="810" y="368" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">la totalisation</text><circle cx="1110" cy="250" r="16" fill="#0e1228" stroke="#7ee0a0" stroke-width="3"/><text x="1110" y="216" font-size="20" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1963</text><rect x="985" y="285" width="250" height="105" rx="14" fill="#7ee0a0" fill-opacity=".08" stroke="#7ee0a0" stroke-width="2"/><text x="1110" y="318" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Une histoire</text><text x="1110" y="343" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">devenue</text><text x="1110" y="368" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">planétaire</text><rect x="60" y="418" width="560" height="140" rx="14" fill="#5ad1e6" fill-opacity=".05" stroke="#5ad1e6" stroke-width="2"/><text x="340" y="450" font-size="19" fill="#5ad1e6" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Sa thèse (1938)</text><text x="340" y="478" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Les limites de l&#x27;objectivité historique :</text><text x="340" y="500" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">ce que la science établit, et ce qui</text><text x="340" y="522" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">relève de la décision et de l&#x27;engagement</text><rect x="660" y="418" width="560" height="140" rx="14" fill="#f2b84b" fill-opacity=".05" stroke="#f2b84b" stroke-width="2"/><circle cx="740" cy="488" r="34" fill="none" stroke="#f2b84b" stroke-width="3" stroke-dasharray="150 64"><animateTransform attributeName="transform" type="rotate" values="0 740 488;360 740 488" dur="6s" repeatCount="indefinite"/></circle><text x="960" y="450" font-size="19" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Le « cercle historiciste »</text><text x="960" y="478" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">L&#x27;historien est lui-même dans l&#x27;histoire :</text><text x="960" y="500" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">un cercle, mais pas un cercle vicieux</text><text x="960" y="522" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">(Sartre, Marx)</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Vers 1930, élève de Brunschvicg, Aron écrit sa thèse sur les</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">limites de l&#x27;objectivité historique, dans une Allemagne</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">doublement historiciste, en philosophie et en politique.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">En 1963, l&#x27;histoire est devenue planétaire. Après le débat de</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1945-1956 avec Sartre et Merleau-Ponty, on compare les régimes</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">concrètement ; reste la question de la totalisation.</text></svg>
