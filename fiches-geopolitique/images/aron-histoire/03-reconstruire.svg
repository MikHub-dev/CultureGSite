"Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Reproduire ? Non : reconstruire</text><rect x="470" y="185" width="330" height="100" rx="14" fill="#7aa2ff" fill-opacity=".1" stroke="#7aa2ff" stroke-width="2"/><text x="635" y="215" font-size="20" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Rickert : l&#x27;esprit</text><text x="635" y="241" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">choisit le singulier</text><text x="635" y="262" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">selon des valeurs</text><rect x="470" y="325" width="330" height="100" rx="14" fill="#7ee0a0" fill-opacity=".1" stroke="#7ee0a0" stroke-width="2"/><text x="635" y="355" font-size="20" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Dilthey : l&#x27;objet</text><text x="635" y="381" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">des humains, qu&#x27;on peut</text><text x="635" y="402" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">comprendre de l&#x27;intérieur</text><path d="M800 235 C860 235 860 305 905 305" fill="none" stroke="#7aa2ff" stroke-width="2.5" marker-end="url(#fl)"/><path d="M800 375 C860 375 860 305 905 305" fill="none" stroke="#7ee0a0" stroke-width="2.5" marker-end="url(#fl)"/><circle r="6" fill="#f2b84b" filter="url(#glow)"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M800 235 C860 235 860 305 905 305"/></circle><circle r="6" fill="#f2b84b" filter="url(#glow)"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M800 375 C860 375 860 305 905 305"/></circle><rect x="910" y="245" width="320" height="120" rx="14" fill="#f2b84b" fill-opacity=".12" stroke="#f2b84b" stroke-width="2"/><text x="1070" y="278" font-size="21" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Max Weber</text><text x="1070" y="306" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">choix libre de l&#x27;objet,</text><text x="1070" y="327" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">puis preuve causale</text><text x="1070" y="348" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">valable pour tous</text><text x="225" y="350" font-size="15" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Les valeurs ne sont pas</text><text x="225" y="370" font-size="15" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">universelles, et la matière</text><text x="225" y="390" font-size="15" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">est déjà structurée</text><text x="225" y="330" font-size="16" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Limite de Rickert</text><text x="640" y="470" font-size="18" fill="#5ad1e6" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Trois objets, trois façons d&#x27;y mettre du sien</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.080;0.140;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="69" y="492" width="299" height="36" rx="18" fill="#7ee0a0" fill-opacity=".14" stroke="#7ee0a0"/><text x="218" y="516" font-size="17" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Une personne : la biographie</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.260;0.320;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="390" y="492" width="366" height="36" rx="18" fill="#f2b84b" fill-opacity=".14" stroke="#f2b84b"/><text x="573" y="516" font-size="17" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Une œuvre : comprendre, c&#x27;est juger</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.440;0.500;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="778" y="492" width="433" height="36" rx="18" fill="#7aa2ff" fill-opacity=".14" stroke="#7aa2ff"/><text x="994" y="516" font-size="17" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Une époque : quel poids à chaque domaine ?</text></g><text x="640" y="556" font-size="16" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">Pas de « critique de la raison historique » transcendantale, au sens de Kant</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">On ne retrouve jamais le passé « tel qu&#x27;il s&#x27;est réellement</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">passé » (Ranke). Rickert : l&#x27;esprit choisit le singulier selon</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">des valeurs. Dilthey : l&#x27;objet est humain, on le comprend.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Weber concilie les deux : l&#x27;historien choisit librement son</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">objet, puis la preuve causale doit valoir pour tous. Et la part</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">du jugement varie selon l&#x27;objet étudié.</text></svg>
