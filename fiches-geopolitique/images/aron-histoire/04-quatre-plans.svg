nt-size="21" fill="#f2b84b" text-anchor="start" font-weight="600" font-family="Spectral, Georgia, &#x27;Times New Roman&#x27;, serif">Les quatre plans, du récit au sens</text><rect x="670" y="180" width="560" height="384" rx="14" fill="#ff6b7a" fill-opacity=".05" stroke="#ff6b7a" stroke-width="2"/><text x="950" y="212" font-size="19" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Thucydide : la guerre, personnage central</text><circle cx="950" cy="330" r="52" fill="#ff6b7a" fill-opacity=".16" stroke="#ff6b7a" stroke-width="2.5" filter="url(#glow)"/><text x="950" y="326" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">La guerre du</text><text x="950" y="345" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Péloponnèse</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.150;0.210;0.920;1" dur="9s" repeatCount="indefinite"/><line x1="950" y1="330" x2="790" y2="266" stroke="#ff6b7a" stroke-opacity=".5" stroke-width="2"/><rect x="695" y="240" width="190" height="56" rx="10" fill="#0e1228" stroke="#f2b84b"/><text x="790" y="262" font-size="15" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Volonté</text><text x="790" y="282" font-size="15" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">ou destin ?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.300;0.360;0.920;1" dur="9s" repeatCount="indefinite"/><line x1="950" y1="330" x2="1110" y2="266" stroke="#ff6b7a" stroke-opacity=".5" stroke-width="2"/><rect x="1015" y="240" width="190" height="56" rx="10" fill="#0e1228" stroke="#f2b84b"/><text x="1110" y="262" font-size="15" fil