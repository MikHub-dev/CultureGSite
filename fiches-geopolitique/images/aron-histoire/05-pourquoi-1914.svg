"#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">ÉTAPE 05 / 06</text><circle cx="1090" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1116" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1142" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1168" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1194" cy="52" r="8" fill="#f2b84b" fill-opacity="1" stroke="#f2b84b"/><circle cx="1220" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><text x="640" y="118" font-size="40" fill="#e6eefc" text-anchor="middle" font-weight="600" font-family="Spectral, Georgia, &#x27;Times New Roman&#x27;, serif">Pourquoi la guerre de 1914 ?</text><text x="640" y="152" font-size="19" fill="#5ad1e6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Un exemple pour montrer les limites de l&#x27;explication historique</text><path d="M110 250 H1150" stroke="#5ad1e6" stroke-width="3" stroke-opacity=".5"/><path d="M126 250 H414" stroke="#5ad1e6" stroke-width="5" stroke-opacity=".6"/><text x="270" y="240" font-size="15" fill="#5ad1e6" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Phase 1</text><path d="M446 250 H774" stroke="#f2b84b" stroke-width="5" stroke-opacity=".6"/><text x="610" y="240" font-size="15" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Phase 2</text><path d="M806 250 H1134" stroke="#ff6b7a" stroke-width="5" stroke-opacity=".6"/><text x="970" y="240" font-size="15" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Phase 3</text><circle r="10" fill="#f2b84b" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" path="M110 250 H1150"/></circle><circle cx="110" cy="250" r="14" fill="#0e1228" stroke="#f2b84b" stroke-width="3"/><text x="110" y="290" font-size="18" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">28 juin</text><text x="110" y="312" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Sarajevo</text><circle cx="430" cy="250" r="14" fill="#0e1228" stroke="#f2b84b" stroke-width="3"/><text x="430" y="290" font-size="18" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">23 juillet</text><text x="430" y="312" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">ultimatum à la Serbie</text><circle cx="790" cy="250" r="14" fill="#0e1228" stroke="#f2b84b" stroke-width="3"/><text x="790" y="290" font-size="18" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">29-30 juillet</text><text x="790" y="312" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">mobilisation russe</text><circle cx="1150" cy="250" r="14" fill="#0e1228" stroke="#f2b84b" stroke-width="3"/><text x="1150" y="290" font-size="18" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">début août</text><text x="1150" y="312" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">déclarations de guerre</text><text x="640" y="350" font-size="16" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Personne ne voulait cette guerre générale, mais beaucoup s&#x27;y attendaient ;</text><text x="640" y="372" font-size="16" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">les alliances et les plans des états-majors ont joué comme des engrenages.</text><text x="640" y="412" font-size="19" fill="#5ad1e6" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Trois principes d&#x27;incertitude (et non de relativité)</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.100;0.160;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="50" y="428" width="340" height="72" rx="14" fill="#7aa2ff" fill-opacity=".12" stroke="#7aa2ff" stroke-width="2"/><text x="220" y="458" font-size="19" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Légitimité</text><text x="220" y="484" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Qui était dans son droit ?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.250;0.310;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="470" y="428" width="340" height="72" rx="14" fill="#7ee0a0" fill-opacity=".12" stroke="#7ee0a0" stroke-width="2"/><text x="640" y="458" font-size="19" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Intentions</text><text x="640" y="484" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Que voulaient-ils ?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.400;0.460;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="890" y="428" width="340" height="72" rx="14" fill="#ff6b7a" fill-opacity=".12" stroke="#ff6b7a" stroke-width="2"/><text x="1060" y="458" font-size="19" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Conséquences</text><text x="1060" y="484" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Qui a pris quel risque ?</text></g><text x="640" y="545" font-size="16" fill="#f2b84b" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">Leçon : ne pas prendre la vérité d&#x27;une conjoncture unique pour une vérité générale (1914 ≠ 1939)</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Juillet 1914 en trois phases. Personne ne voulait cette guerre</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">générale, mais beaucoup s&#x27;y attendaient, et les alliances et les</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">plans des états-majors ont joué comme des engrenages.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Trois questions à ne pas mélanger : la légitimité, les</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">intentions, les conséquences. Des principes d&#x27;incertitude, pas</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">de relativité : l&#x27;objectivité reste un devoir.</text></svg>
