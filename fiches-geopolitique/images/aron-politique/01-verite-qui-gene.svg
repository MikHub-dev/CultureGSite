 font-size="16" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">ÉTAPE 01 / 06</text><circle cx="1090" cy="52" r="8" fill="#f2b84b" fill-opacity="1" stroke="#f2b84b"/><circle cx="1116" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1142" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1168" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1194" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1220" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><text x="640" y="118" font-size="40" fill="#e6eefc" text-anchor="middle" font-weight="600" font-family="Spectral, Georgia, &#x27;Times New Roman&#x27;, serif">La politique, amorale et souvent immorale</text><text x="640" y="152" font-size="19" fill="#5ad1e6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Pourquoi Aron est resté spectateur de la politique plutôt qu&#x27;acteur</text><g><animateTransform attributeName="transform" type="translate" values="0 0;-30 0;0 0" dur="6s" repeatCount="indefinite"/><circle cx="420" cy="330" r="120" fill="#7ee0a0" fill-opacity=".16" stroke="#7ee0a0" stroke-width="2.5"/><text x="420" y="300" font-size="22" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Les relations</text><text x="420" y="330" font-size="22" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">humaines</text><text x="420" y="360" font-size="22" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">qu&#x27;il aime</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;30 0;0 0" dur="6s" repeatCount="indefinite"/><circle cx="860" cy="330" r="120" fill="#ff6b7a" fill-opacity=".16" stroke="#ff6b7a" stroke-width="2.5"/><text x="860" y="300" font-size="22" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">La politique :</text><text x="860" y="330" font-size="22" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">conquérir et</text><text x="860" y="360" font-size="22" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">exercer le pouvoir</text></g><path d="M640 200 l-14 40 l22 30 l-20 36 l18 34 l-16 40 l10 70" fill="none" stroke="#f2b84b" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="1;.4;1" dur="3s" repeatCount="indefinite"/></path><text x="640" y="192" font-size="18" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Incompatibilité radicale</text><text x="860" y="480" font-size="17" fill="#ff6b7a" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">au mieux amorale, souvent immorale</text><path d="M90 230 Q140 190 190 230 Q140 270 90 230Z" fill="none" stroke="#5ad1e6" stroke-width="2.5"/><circle cx="140" cy="230" r="12" fill="#5ad1e6"><animate attributeName="cx" values="132;148;132" dur="4s" repeatCount="indefinite"/></circle><text x="140" y="290" font-size="18" fill="#5ad1e6" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Spectateur</text><text x="140" y="312" font-size="16" fill="#5ad1e6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">plutôt qu&#x27;acteur</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.080;0.140;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="175" y="520" width="126" height="36" rx="18" fill="#f2b84b" fill-opacity=".14" stroke="#f2b84b"/><text x="238" y="544" font-size="17" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Impatience</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.260;0.320;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="337" y="520" width="280" height="36" rx="18" fill="#f2b84b" fill-opacity=".14" stroke="#f2b84b"/><text x="477" y="544" font-size="17" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Supporte mal les imbéciles</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.440;0.500;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="653" y="520" width="452" height="36" rx="18" fill="#ff6b7a" fill-opacity=".14" stroke="#ff6b7a"/><text x="879" y="544" font-size="17" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Ne pourrait ordonner la violence puis dormir</text></g><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">La vérité qui le gêne le plus : les relations humaines qu&#x27;il</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">aime et la politique sont incompatibles. Conquérir et exercer le</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">pouvoir est amoral, souvent immoral.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Il reste donc spectateur, « voyeur » dit-il. Autres raisons :</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">son impatience, et il ne pourrait pas ordonner des actes</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">violents puis dormir en paix.</text></svg>
