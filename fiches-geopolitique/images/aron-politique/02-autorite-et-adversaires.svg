goe UI&#x27;, system-ui, sans-serif">En politique :</text><text x="170" y="414" font-size="18" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">nécessaire</text><line x1="510" y1="270" x2="510" y2="330" stroke="#9fb3d6" stroke-width="2"/><path d="M450 330 h120 l-20 24 h-80z" fill="#ff6b7a" fill-opacity=".2" stroke="#ff6b7a" stroke-width="2"/><text x="510" y="390" font-size="18" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Pour lui-même :</text><text x="510" y="414" font-size="18" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">détestée</text></g><text x="340" y="500" font-size="16" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Il laisse ses étudiants choisir</text><text x="340" y="521" font-size="16" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">leur sujet de thèse</text><rect x="660" y="180" width="560" height="370" rx="14" fill="#f2b84b" fill-opacity=".05" stroke="#f2b84b" stroke-width="2"/><text x="940" y="214" font-size="21" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Sartre, de l&#x27;ami au polémiste</text><line x1="700" y1="300" x2="1170" y2="300" stroke="#9fb3d6" stroke-opacity=".5" stroke-width="3"/><circle cx="720" cy="300" r="10" fill="#0e1228" stroke="#7ee0a0" stroke-width="3"/><text x="720" y="345" font-size="17" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">École</text><text x="720" y="367" font-size="17" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">normale</text><circle cx="850" cy="300" r="10" fill="#0e1228" stroke="#5ad1e6" stroke-width="3"/><text x="850" y="345" font-size="17" fill="#5ad1e6" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Distance</text><text x="850" y="367" font-size="17" fill="#5ad1e6" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">amicale</text><circle cx="980" cy="300" r="10" fill="#0e1228" stroke="#7aa2ff" stroke-width="3"/><text x="980" y="345" font-size="17" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Guerre</text><text x="980" y="367" font-size="17" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">froide</text><circle cx="1110" cy="300" r="10" fill="#0e1228" stroke="#ff6b7a" stroke-width="3"/><text x="1110" y="345" font-size="17" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1968 :</text><text x="1110" y="367" font-size="17" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">polémique</text><circle r="8" fill="#f2b84b" filter="url(#glow)"><animateMotion dur="7s" repeatCount="indefinite" path="M720 300 H1110"/></circle><text x="940" y="430" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Le polémiste « dans un petit coin »,</text><text x="940" y="456" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">le philosophe toujours admiré</text><text x="940" y="515" font-size="16" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Critique de tous les dirigeants, de Gaulle compris</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">En politique, il croit l&#x27;autorité nécessaire. À titre personnel,</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">il la déteste : il laisse ses étudiants choisir leur sujet de</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">thèse, même s&#x27;il le juge mauvais.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Il a critiqué tous les dirigeants, de Gaulle compris. Avec</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Sartre, l&#x27;amitié de jeunesse a cédé à la polémique, mais il</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">admire toujours le philosophe.</text></svg>
