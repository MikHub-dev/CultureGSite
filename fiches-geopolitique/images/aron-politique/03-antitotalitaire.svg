15" y="58" font-size="16" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">ÉTAPE 03 / 06</text><circle cx="1090" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1116" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1142" cy="52" r="8" fill="#f2b84b" fill-opacity="1" stroke="#f2b84b"/><circle cx="1168" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1194" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1220" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><text x="640" y="118" font-size="40" fill="#e6eefc" text-anchor="middle" font-weight="600" font-family="Spectral, Georgia, &#x27;Times New Roman&#x27;, serif">Antitotalitaire depuis l&#x27;Allemagne de 1933</text><text x="640" y="152" font-size="19" fill="#5ad1e6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Une conviction née en voyant monter le national-socialisme</text><path d="M160 260 H1030" stroke="#5ad1e6" stroke-width="3" stroke-opacity=".5" filter="url(#glow)"/><circle r="10" fill="#f2b84b" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" path="M160 260 H1030"/></circle><circle cx="160" cy="260" r="16" fill="#0e1228" stroke="#ff6b7a" stroke-width="3"/><text x="160" y="225" font-size="20" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1931-1933</text><rect x="45" y="300" width="230" height="110" rx="14" fill="#ff6b7a" fill-opacity=".08" stroke="#ff6b7a" stroke-width="2"/><text x="160" y="334" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">En Allemagne :</text><text x="160" y="360" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">montée du</text><text x="160" y="386" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">nazisme</text><circle cx="450" cy="260" r="16" fill="#0e1228" stroke="#f2b84b" stroke-width="3"/><text x="450" y="225" font-size="20" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1933-1939</text><rect x="335" y="300" width="230" height="110" rx="14" fill="#f2b84b" fill-opacity=".08" stroke="#f2b84b" stroke-width="2"/><text x="450" y="334" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">« Dans l&#x27;attente</text><text x="450" y="360" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">de la catastrophe »</text><text x="450" y="386" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">premiers livres</text><circle cx="740" cy="260" r="16" fill="#0e1228" stroke="#7aa2ff" stroke-width="3"/><text x="740" y="225" font-size="20" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Après 1945</text><rect x="625" y="300" width="230" height="110" rx="14" fill="#7aa2ff" fill-opacity=".08" stroke="#7aa2ff" stroke-width="2"/><text x="740" y="334" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">La « fureur</text><text x="740" y="360" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">antitotalitaire »</text><text x="740" y="386" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">vise le stalinisme</text><circle cx="1030" cy="260" r="16" fill="#0e1228" stroke="#7ee0a0" stroke-width="3"/><text x="1030" y="225" font-size="20" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">XXe congrès</text><rect x="915" y="300" width="230" height="110" rx="14" fill="#7ee0a0" fill-opacity=".08" stroke="#7ee0a0" stroke-width="2"/><text x="1030" y="334" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Khrouchtchev dit</text><text x="1030" y="360" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">le double de ce</text><text x="1030" y="386" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">qu&#x27;écrivait Aron</text><rect x="240" y="440" width="800" height="110" rx="14" fill="#ff6b7a" fill-opacity=".06" stroke="#ff6b7a" stroke-width="2"/><text x="640" y="474" font-size="19" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Les révolutions, selon Aron</text><text x="640" y="504" font-size="17" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">coûtent très cher, font plus de mal que de bien :</text><text x="640" y="527" font-size="17" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">elles suppriment certains maux et en créent d&#x27;autres</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Aron se dit anti-révolutionnaire : les révolutions coûtent très</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">cher et font plus de mal que de bien. Le fond, c&#x27;est</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">l&#x27;antitotalitarisme.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Il le date de son séjour en Allemagne (1931-1933). Après 1945,</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">sa colère vise le stalinisme, ce qui le met au ban de</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">l&#x27;intelligentsia.</text></svg>
