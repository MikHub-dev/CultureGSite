fill="#7ee0a0" filter="url(#glow)"><animateMotion dur="6s" begin="0.0s" repeatCount="indefinite" path="M160 400 C320 400 360 230 560 230 H1050"/></circle><circle r="8" fill="#ff6b7a" filter="url(#glow)"><animateMotion dur="6s" begin="1.5s" repeatCount="indefinite" path="M160 400 C320 400 360 520 560 520 H1050"/></circle><circle r="8" fill="#f2b84b" filter="url(#glow)"><animateMotion dur="6s" begin="3.0s" repeatCount="indefinite" path="M160 400 H700 C780 400 800 230 900 230"/></circle><circle r="8" fill="#f2b84b" filter="url(#glow)"><animateMotion dur="6s" begin="4.5s" repeatCount="indefinite" path="M160 400 H700 C780 400 800 520 900 520"/></circle><text x="450" y="210" font-size="17" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Anti-révolutionnaire = libéral et démocrate</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Citant Malraux, il dit que la droite traditionnelle n&#x27;existe</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">plus : on est révolutionnaire ou anti-révolutionnaire, donc</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">libéral et démocrate comme lui.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Améliorer peu à peu la démocratie libérale, ou passer au parti</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">unique. L&#x27;union des socialistes avec le PC finirait, selon lui,</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">par une rupture ou par la dérive.</text></svg>
