roite du clavier</text><text x="70" y="652" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">passent à l&#x27;étape précédente ou suivante. La fiche explique chaque étape et donne les parties de la vidéo</text><text x="70" y="676" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">(émission Variances de Michèle Arnaud, ORTF, 13 décembre 1974, publiée par l&#x27;INA).</text></svg>
