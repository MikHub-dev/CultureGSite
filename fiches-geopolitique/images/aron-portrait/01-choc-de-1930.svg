-size="16" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">ÉTAPE 01 / 06</text><circle cx="1090" cy="52" r="8" fill="#f2b84b" fill-opacity="1" stroke="#f2b84b"/><circle cx="1116" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1142" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1168" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1194" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1220" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><text x="640" y="118" font-size="40" fill="#e6eefc" text-anchor="middle" font-weight="600" font-family="Spectral, Georgia, &#x27;Times New Roman&#x27;, serif">« L&#x27;histoire est en mouvement »</text><text x="640" y="152" font-size="19" fill="#5ad1e6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Comment l&#x27;Allemagne de 1930 et Max Weber ont tourné le philosophe vers la politique</text><path d="M150 270 H630" stroke="#5ad1e6" stroke-width="3" stroke-opacity=".5" filter="url(#glow)"/><circle r="9" fill="#f2b84b" filter="url(#glow)"><animateMotion dur="7s" repeatCount="indefinite" path="M150 270 H630"/></circle><circle cx="150" cy="270" r="15" fill="#0e1228" stroke="#9fb3d6" stroke-width="3"/><text x="150" y="236" font-size="19" fill="#9fb3d6" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Philosophie pure</text><text x="150" y="310" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">la politique, une</text><text x="150" y="332" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">« décadence »</text><circle cx="390" cy="270" r="15" fill="#0e1228" stroke="#ff6b7a" stroke-width="3"/><text x="390" y="236" font-size="19" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Mars 1930</text><text x="390" y="310" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">l&#x27;Allemagne en crise :</text><text x="390" y="332" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">« History is on the move »</text><circle cx="630" cy="270" r="15" fill="#0e1228" stroke="#f2b84b" stroke-width="3"/><text x="630" y="236" font-size="19" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Le projet</text><text x="630" y="310" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">comprendre l&#x27;histoire</text><text x="630" y="332" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">en y participant</text><rect x="470" y="370" width="320" height="80" rx="14" fill="#f2b84b" fill-opacity=".08" stroke="#f2b84b" stroke-width="2"/><text x="630" y="402" font-size="17" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">« Dedans et dehors » :</text><text x="630" y="426" font-size="17" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">l&#x27;action et le détachement</text><rect x="60" y="370" width="380" height="80" rx="14" fill="#7aa2ff" fill-opacity=".06" stroke="#7aa2ff" stroke-width="2"/><text x="250" y="400" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Juif sous Hitler : un judaïsme</text><text x="250" y="422" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">reçu « du dehors », assumé</text><rect x="830" y="180" width="400" height="380" rx="14" fill="#7ee0a0" fill-opacity=".05" stroke="#7ee0a0" stroke-width="2"/><text x="1030" y="212" font-size="20" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Max Weber, le modèle</text><path d="M1030 400 V280 M990 400 H1070" stroke="#9fb3d6" stroke-width="3"/><g><animateTransform attributeName="transform" type="rotate" values="-9 1030 280;9 1030 280;-9 1030 280" dur="7s" repeatCount="indefinite"/><line x1="900" y1="280" x2="1160" y2="280" stroke="#9fb3d6" stroke-width="4"/><line x1="900" y1="280" x2="900" y2="320" stroke="#9fb3d6" stroke-width="2"/><path d="M850 320 h100 l-16 22 h-68z" fill="#5ad1e6" fill-opacity=".2" stroke="#5ad1e6" stroke-width="2"/><text x="900" y="370" font-size="17" fill="#5ad1e6" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Le savant</text><line x1="1160" y1="280" x2="1160" y2="320" stroke="#9fb3d6" stroke-width="2"/><path d="M1110 320 h100 l-16 22 h-68z" fill="#ff6b7a" fill-opacity=".2" stroke="#ff6b7a" stroke-width="2"/><text x="1160" y="370" font-size="17" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Le politique</text></g><text x="1030" y="440" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Choisir une existence,</text><text x="1030" y="462" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">c&#x27;est en abandonner une autre</text><text x="1030" y="505" font-size="16" fill="#f2b84b" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">« Homme politique frustré,</text><text x="1030" y="527" font-size="16" fill="#f2b84b" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">et secrètement satisfait »</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Jeune philosophe néo-kantien, Aron fuyait la politique. En mars</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1930, l&#x27;Allemagne en crise le saisit : il veut comprendre</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">l&#x27;histoire en y participant, « dedans et dehors ».</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Son modèle devient Max Weber, savant et politique, pour qui</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">choisir une vie, c&#x27;est en abandonner une autre. Aron se dit</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">homme politique frustré, et secrètement satisfait de l&#x27;être.</text></svg>
