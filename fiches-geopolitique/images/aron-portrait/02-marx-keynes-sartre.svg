e="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">améliorer ce qui peut l&#x27;être</text><text x="370" y="472" font-size="18" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">dans un monde mauvais</text><text x="370" y="520" font-size="16" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">« Décevant, je l&#x27;accorde »</text><rect x="720" y="180" width="500" height="380" rx="14" fill="#7aa2ff" fill-opacity=".04" stroke="#7aa2ff" stroke-width="2"/><text x="970" y="212" font-size="20" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Sartre, l&#x27;ami perdu</text><path d="M760 300 H900" stroke="#7ee0a0" stroke-width="5"/><path d="M900 300 C960 300 980 260 1180 260" fill="none" stroke="#7aa2ff" stroke-width="4"/><path d="M900 300 C960 300 980 340 1180 340" fill="none" stroke="#ff6b7a" stroke-width="4"/><circle r="7" fill="#7aa2ff" filter="url(#glow)"><animateMotion dur="6s" begin="0.0s" repeatCount="indefinite" path="M760 300 H900 C960 300 980 260 1180 260"/></circle><circle r="7" fill="#ff6b7a" filter="url(#glow)"><animateMotion dur="6s" begin="0.4s" repeatCount="indefinite" path="M760 300 H900 C960 300 980 340 1180 340"/></circle><text x="830" y="285" font-size="15" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">École normale</text><text x="900" y="330" font-size="14" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Temps modernes</text><text x="1180" y="248" font-size="16" fill="#7aa2ff" text-anchor="end" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Aron</text><text x="1180" y="368" font-size="16" fill="#ff6b7a" text-anchor="end" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Sartre</text><text x="970" y="420" font-size="16" fill="#ff6b7a" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Sartre : pas d&#x27;amitié</text><text x="970" y="442" font-size="16" fill="#ff6b7a" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">avec un adversaire politique</text><text x="970" y="475" font-size="16" fill="#7aa2ff" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Aron : « un libéral n&#x27;a pas l&#x27;âme</text><text x="970" y="497" font-size="16" fill="#7aa2ff" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">tendre, il a la peau dure »</text><text x="970" y="535" font-size="14" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">La promesse : le survivant écrira la nécrologie</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Il aurait voulu devenir marxiste pour que l&#x27;histoire choisisse à</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">sa place. Il lit les trois tomes du Capital, n&#x27;est pas</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">convaincu, puis Keynes : il choisira d&#x27;améliorer ce qui peut</text><text x="66" y="684" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">l&#x27;être.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Ami intime de Sartre à l&#x27;École normale, il quitte vite Les Temps</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">modernes. Pour Sartre, on ne reste pas amis en désaccord</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">politique ; pour Aron, « un libéral a la peau dure ».</text></svg>
