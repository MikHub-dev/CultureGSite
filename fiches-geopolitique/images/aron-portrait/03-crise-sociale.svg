"#7aa2ff" text-anchor="start" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">un demi-siècle : la croissance</text><path d="M100 536 H960" stroke="#7ee0a0" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#fl)"/><text x="976" y="542" font-size="16" fill="#7ee0a0" text-anchor="start" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">les arrière-neveux : une utopie</text><circle cx="66" cy="498" r="24" fill="#f2b84b" fill-opacity=".16" stroke="#f2b84b" stroke-width="2.5"/><text x="66" y="503" font-size="12" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1974</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Rien ne prouve que la violence ait augmenté, même si certaines</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">formes sont nouvelles. Mais les sociétés qui proclament</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">l&#x27;égalité sans la réaliser créent de la frustration.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Chacun se sent pris dans une « machine folle » que personne ne</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">dirige. Aron distingue trois horizons de la crise : 5-8 ans, un</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">demi-siècle, et l&#x27;utopie d&#x27;une civilisation stationnaire.</text></svg>
