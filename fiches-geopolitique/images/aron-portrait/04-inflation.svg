text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">1930 : une petite « dent », des millions de chômeurs, Hitler</text><rect x="620" y="180" width="600" height="380" rx="14" fill="#7aa2ff" fill-opacity=".04" stroke="#7aa2ff" stroke-width="2"/><text x="920" y="212" font-size="20" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Le marché commun en danger</text><circle cx="860" cy="350" r="150" fill="#7ee0a0" fill-opacity=".06" stroke="#7ee0a0" stroke-width="2.5" stroke-dasharray="10 7"><animate attributeName="r" values="150;130;150" dur="6s" repeatCount="indefinite"/></circle><text x="860" y="245" font-size="15" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">le « noyau dur »</text><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 0" dur="6s" repeatCount="indefinite"/><circle cx="860" cy="330" r="24" fill="#7ee0a0" fill-opacity=".16" stroke="#7ee0a0" stroke-width="2.5"/><text x="860" y="374" font-size="15" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">RFA</text><text x="860" y="335" font-size="13" fill="#e6eefc" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">7 %</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 0" dur="6s" repeatCount="indefinite"/><circle cx="760" cy="330" r="24" fill="#7ee0a0" fill-opacity=".16" stroke="#7ee0a0" stroke-width="2.5"/><text x="760" y="374" font-size="15" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Benelux</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 0" dur="6s" repeatCount="indefinite"/><circle cx="940" cy="280" r="24" fill="#7ee0a0" fill-opacity=".16" stroke="#7ee0a0" stroke-width="2.5"/><text x="940" y="324" font-size="15" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Scandinavie</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;40 0;0 0" dur="6s" repeatCount="indefinite"/><circle cx="880" cy="420" r="24" fill="#f2b84b" fill-opacity=".16" stroke="#f2b84b" stroke-width="2.5"/><text x="880" y="464" font-size="15" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">France</text><text x="880" y="425" font-size="13" fill="#e6eefc" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">16 %</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;-40 0;0 0" dur="6s" repeatCount="indefinite"/><circle cx="690" cy="470" r="24" fill="#ff6b7a" fill-opacity=".16" stroke="#ff6b7a" stroke-width="2.5"/><text x="690" y="514" font-size="15" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Italie</text><text x="690" y="475" font-size="13" fill="#e6eefc" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">20 %</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;40 0;0 0" dur="6s" repeatCount="indefinite"/><circle cx="1110" cy="460" r="24" fill="#ff6b7a" fill-opacity=".16" stroke="#ff6b7a" stroke-width="2.5"/><text x="1110" y="504" font-size="15" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Royaume-Uni</text><text x="1110" y="465" font-size="13" fill="#e6eefc" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">20 %</text></g><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Depuis 20 ans, l&#x27;Occident vivait avec 3 à 8 % d&#x27;inflation ; le</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">pétrole quadruplé la pousse à 10-20 %. Or la crise de 1930,</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">petite « dent » sur la courbe, a mené à Hitler.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Avec 7 % en Allemagne et 15 à 20 % en France, en Italie et en</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Angleterre, le marché commun « sauterait ». Il faut sauver un</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">noyau dur autour de la RFA, avec la France.</text></svg>
