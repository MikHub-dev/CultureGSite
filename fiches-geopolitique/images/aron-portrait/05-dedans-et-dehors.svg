 fill-opacity="0.4"/><circle cx="350.6" cy="193.5" r="1.6" fill="#e6eefc" fill-opacity="0.4"/><circle cx="1180.6" cy="96.6" r="1.6" fill="#e6eefc" fill-opacity="0.4"/><circle cx="1224.3" cy="290.2" r="0.9" fill="#e6eefc" fill-opacity="0.25"/><circle cx="1070.9" cy="524.9" r="1.6" fill="#e6eefc" fill-opacity="0.4"/><circle cx="885.0" cy="403.0" r="1.6" fill="#e6eefc" fill-opacity="0.25"/><circle cx="789.5" cy="524.3" r="1.6" fill="#e6eefc" fill-opacity="0.4"/><circle cx="798.4" cy="433.8" r="1.2" fill="#e6eefc" fill-opacity="0.6"/><circle cx="1274.9" cy="109.5" r="1.6" fill="#e6eefc" fill-opacity="0.6"/><circle cx="832.1" cy="122.7" r="0.9" fill="#e6eefc" fill-opacity="0.6"/><circle cx="919.6" cy="552.4" r="0.9" fill="#e6eefc" fill-opacity="0.25"/><circle cx="69.3" cy="74.8" r="1.2" fill="#e6eefc" fill-opacity="0.25"/><circle cx="617.8" cy="307.1" r="1.6" fill="#e6eefc" fill-opacity="0.4"/><circle cx="449.4" cy="371.0" r="0.6" fill="#e6eefc" fill-opacity="0.6"/><circle cx="261.6" cy="402.1" r="1.2" fill="#e6eefc" fill-opacity="0.25"/><circle cx="448.7" cy="533.2" r="1.6" fill="#e6eefc" fill-opacity="0.25"/><circle cx="881.7" cy="306.5" r="0.6" fill="#e6eefc" fill-opacity="0.6"/><circle cx="785.4" cy="53.1" r="1.2" fill="#e6eefc" fill-opacity="0.6"/><circle cx="375.3" cy="196.9" r="0.9" fill="#e6eefc" fill-opacity="0.4"/><circle cx="523.8" cy="315.8" r="1.2" fill="#e6eefc" fill-opacity="0.4"/><circle cx="181.9" cy="333.7" r="1.6" fill="#e6eefc" fill-opacity="0.25"/><circle cx="1239.0" cy="340.8" r="1.2" fill="#e6eefc" fill-opacity="0.6"/><circle cx="1.2" cy="60.4" r="0.9" fill="#e6eefc" fill-opacity="0.4"/><circle cx="805.7" cy="499.1" r="1.6" fill="#e6eefc" fill-opacity="0.4"/><circle cx="552.6" cy="126.7" r="1.2" fill="#e6eefc" fill-opacity="0.4"/><circle cx="1244.7" cy="212.7" r="0.9" fill="#e6eefc" fill-opacity="0.6"/><rect x="40" y="34" width="150" height="36" rx="18" fill="#f2b84b" fill-opacity=".14" stroke="#f2b84b"/><text x="115" y="58" font-size="16" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">ÉTAPE 05 / 06</text><circle cx="1090" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1116" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1142" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1168" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1194" cy="52" r="8" fill="#f2b84b" fill-opacity="1" stroke="#f2b84b"/><circle cx="1220" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><text x="640" y="118" font-size="40" fill="#e6eefc" text-anchor="middle" font-weight="600" font-family="Spectral, Georgia, &#x27;Times New Roman&#x27;, serif">L&#x27;observateur engagé</text><text x="640" y="152" font-size="19" fill="#5ad1e6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Prendre position de temps en temps, et regarder agir de Gaulle, Kennedy et Kissinger</text><text x="360" y="205" font-size="20" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Les prises de position</text><path d="M90 260 H630" stroke="#5ad1e6" stroke-width="3" stroke-opacity=".5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.050;0.110;0.920;1" dur="9s" repeatCount="indefinite"/><circle cx="90" cy="260" r="14" fill="#0e1228" stroke="#5ad1e6" stroke-width="3"/><text x="90" y="300" font-size="16" fill="#5ad1e6" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Londres</text><text x="90" y="320" font-size="14" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1940-1944</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.170;0.230;0.920;1" dur="9s" repeatCount="indefinite"/><circle cx="230" cy="260" r="14" fill="#0e1228" stroke="#ff6b7a" stroke-width="3"/><text x="230" y="300" font-size="16" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Stalinisme</text><text x="230" y="320" font-size="14" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1947-1956</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.290;0.350;0.920;1" dur="9s" repeatCount="indefinite"/><circle cx="370" cy="260" r="14" fill="#0e1228" stroke="#7ee0a0" stroke-width="3"/><text x="370" y="300" font-size="16" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Algérie</text><text x="370" y="320" font-size="14" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1957</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.410;0.470;0.920;1" dur="9s" repeatCount="indefinite"/><circle cx="510" cy="260" r="14" fill="#0e1228" stroke="#f2b84b" stroke-width="3"/><text x="510" y="300" font-size="16" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Mai 68</text><text x="510" y="320" font-size="14" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Le Figaro</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.530;0.590;0.920;1" dur="9s" repeatCount="indefinite"/><circle cx="630" cy="260" r="14" fill="#0e1228" stroke="#7aa2ff" stroke-width="3"/><text x="630" y="300" font-size="16" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1974</text><text x="630" y="320" font-size="14" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">présidentielle</text></g><rect x="60" y="350" width="600" height="210" rx="14" fill="#5ad1e6" fill-opacity=".05" stroke="#5ad1e6" stroke-width="2"/><text x="360" y="382" font-size="17" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Ni « mandarin hors du siècle », ni militant :</text><text x="360" y="406" font-size="17" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">il dit quand il parle en citoyen</text><text x="360" y="450" font-size="15" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">À Londres, pas gaulliste orthodoxe : il espérait</text><text x="360" y="471" font-size="15" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">réconcilier les « bons Français » de Vichy et de Londres.</text><text x="360" y="492" font-size="15" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Juste pour un observateur, pas pour de Gaulle.</text><text x="360" y="535" font-size="15" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Mis au ban de l&#x27;intelligentsia en 1947-1956, puis en 1967</text><rect x="700" y="180" width="520" height="180" rx="14" fill="#7aa2ff" fill-opacity=".06" stroke="#7aa2ff" stroke-width="2"/><circle cx="780" cy="270" r="46" fill="#7aa2ff" fill-opacity=".16" stroke="#7aa2ff" stroke-width="2.5"/><text x="780" y="277" font-size="30" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Spectral, Georgia, &#x27;Times New Roman&#x27;, serif">K</text><text x="850" y="230" font-size="21" fill="#7aa2ff" text-anchor="start" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Kennedy</text><text x="850" y="264" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">« Que faire à Cuba ? »</text><text x="850" y="288" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">« Rien » (et Machiavel)</text><rect x="700" y="375" width="520" height="180" rx="14" fill="#f2b84b" fill-opacity=".06" stroke="#f2b84b" stroke-width="2"/><circle cx="780" cy="465" r="46" fill="#f2b84b" fill-opacity=".16" stroke="#f2b84b" stroke-width="2.5"/><text x="780" y="472" font-size="30" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Spectral, Georgia, &#x27;Times New Roman&#x27;, serif">K</text><text x="850" y="425" font-size="21" fill="#f2b84b" text-anchor="start" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Kissinger</text><text x="850" y="459" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Négociateur exceptionnel :</text><text x="850" y="483" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Vietnam, Proche-Orient</text><text x="850" y="505" font-size="14" fill="#9fb3d6" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">« Je n&#x27;aurais pas pu ordonner des bombardements</text><text x="850" y="523" font-size="14" fill="#9fb3d6" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">puis aller dormir tranquille »</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Professeur et journaliste, Aron prend parfois position :</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">l&#x27;Algérie, Mai 68, l&#x27;élection de 1974. À Londres, il n&#x27;était pas</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">gaulliste orthodoxe et ménageait les Français de Vichy.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">À Kennedy, qui l&#x27;interroge sur Cuba, il conseille de ne rien</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">faire. Il admire Kissinger, négociateur exceptionnel, mais</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">n&#x27;aurait pas pu ordonner des bombardements puis dormir.</text></svg>
