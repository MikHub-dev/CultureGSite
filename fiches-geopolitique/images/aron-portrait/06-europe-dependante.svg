 sans-serif">de l&#x27;Ouest</text><rect x="960" y="250" width="240" height="120" rx="14" fill="#7ee0a0" fill-opacity=".1" stroke="#7ee0a0" stroke-width="2"/><text x="1080" y="296" font-size="19" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">États-Unis</text><text x="1080" y="322" font-size="19" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">autorités monétaires</text><path d="M320 285 H520" stroke="#f2b84b" stroke-width="4" marker-end="url(#fl)"/><text x="420" y="270" font-size="16" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">pétrole ×4</text><path d="M520 340 C460 420 380 420 320 340" fill="none" stroke="#ff6b7a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#fl)"/><text x="420" y="440" font-size="15" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">une facture impayable</text><path d="M200 370 C200 520 1080 520 1080 370" fill="none" stroke="#9fb3d6" stroke-width="2.5" stroke-dasharray="6 6"/><path d="M960 330 C880 330 840 340 760 340" fill="none" stroke="#7ee0a0" stroke-width="3.5" marker-end="url(#fl)"/><text x="860" y="375" font-size="15" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">dollars prêtés</text><text x="640" y="515" font-size="15" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">le marché des pétrodollars</text><circle r="7" fill="#f2b84b" filter="url(#glow)"><animateMotion dur="5s" begin="0.0s" repeatCount="indefinite" path="M320 285 H520"/></circle><circle r="7" fill="#9fb3d6" filter="url(#glow)"><animateMotion dur="5s" begin="1.2s" repeatCount="indefinite" path="M200 370 C200 520 1080 520 1080 370"/></circle><circle r="7" fill="#7ee0a0" filter="url(#glow)"><animateMotion dur="5s" begin="2.4s" repeatCount="indefinite" path="M960 330 C880 330 840 340 760 340"/></circle><path d="M640 190 C590 190 560 205 560 205 V235 M640 190 C690 190 720 205 720 205 V235" fill="none" stroke="#7ee0a0" stroke-width="3"><animate attributeName="stroke-opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></path><text x="640" y="180" font-size="15" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Sécurité : la force américaine (guerre du Kippour)</text><text x="640" y="556" font-size="17" fill="#f2b84b" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">« On ne change pas la réalité par des cocoricos »</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">La guerre du Kippour montre que l&#x27;Europe n&#x27;a aucun moyen</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">militaire dans la région dont dépend sa prospérité. Puis le</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">pétrole quadruple : elle ne peut plus payer sa facture</text><text x="66" y="684" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">d&#x27;énergie.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Elle paie avec des dollars prêtés par les pays pétroliers, via</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">un marché des pétrodollars commandé par les États-Unis. « On ne</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">change pas la réalité par des cocoricos. »</text></svg>
