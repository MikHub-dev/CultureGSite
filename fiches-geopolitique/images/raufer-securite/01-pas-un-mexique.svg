sans-serif">de l&#x27;armée</text><rect x="390" y="260" width="120" height="200" rx="8" fill="#ff6b7a" fill-opacity=".35" stroke="#ff6b7a" stroke-width="2"><animate attributeName="height" values="60;200;200" keyTimes="0;.4;1" dur="9s" repeatCount="indefinite"/><animate attributeName="y" values="400;260;260" keyTimes="0;.4;1" dur="9s" repeatCount="indefinite"/></rect><text x="450" y="484" font-size="15" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Hommes armés</text><text x="450" y="504" font-size="15" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">des cartels</text><line x1="140" y1="460" x2="540" y2="460" stroke="#9fb3d6" stroke-width="2"/><text x="340" y="545" font-size="15" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">Blindés, armes capables d&#x27;abattre des hélicoptères</text><rect x="660" y="180" width="560" height="380" rx="14" fill="#7aa2ff" fill-opacity=".04" stroke="#7aa2ff" stroke-width="2"/><text x="940" y="212" font-size="18" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">En France, selon Raufer</text><g><polygon points="860,240 973,305 973,435 860,500 747,435 747,305" fill="#7ee0a0" fill-opacity=".1" stroke="#7ee0a0" stroke-width="2.5"/><animate attributeName="opacity" values=".6;1;.6" dur="4s" repeatCount="indefinite"/></g><text x="860" y="375" font-size="17" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Gendarmerie</text><text x="860" y="398" font-size="14" fill="#7ee0a0" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">95 % du territoire</text><circle cx="800" cy="300" r="7" fill="#ff6b7a"><animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="920" cy="320" r="7" fill="#ff6b7a"><animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="830" cy="455" r="7" fill="#ff6b7a"><animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="935" cy="430" r="7" fill="#ff6b7a"><animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/></circle><text x="1105" y="290" font-size="16" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Points chauds</text><text x="1105" y="312" font-size="16" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">très localisés,</text><text x="1105" y="334" font-size="16" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">en ville</text><text x="1105" y="400" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Un État qui</text><text x="1105" y="422" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">garde sa force</text><text x="940" y="545" font-size="15" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">L&#x27;échec viendrait des dirigeants, pas de la menace</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Des magistrats mexicains préviennent : sans réaction, la France</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">pourrait devenir un nouveau Mexique d&#x27;ici dix ans. Là-bas, des</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">cartels ont plus d&#x27;hommes armés que l&#x27;armée.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Pour Raufer, c&#x27;est impossible en France : territoire plus petit,</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">gendarmerie bien informée, État encore solide. L&#x27;échec actuel</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">vient, selon lui, de dirigeants incompétents.</text></svg>
