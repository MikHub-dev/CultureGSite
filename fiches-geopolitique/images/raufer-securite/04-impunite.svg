ext x="115" y="58" font-size="16" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">ÉTAPE 04 / 05</text><circle cx="1116" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1142" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1168" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><circle cx="1194" cy="52" r="8" fill="#f2b84b" fill-opacity="1" stroke="#f2b84b"/><circle cx="1220" cy="52" r="6" fill="#5ad1e6" fill-opacity=".15" stroke="#5ad1e6"/><text x="640" y="118" font-size="40" fill="#e6eefc" text-anchor="middle" font-weight="600" font-family="Spectral, Georgia, &#x27;Times New Roman&#x27;, serif">« Les malfaiteurs ne s&#x27;arrêtent que quand on les arrête »</text><text x="640" y="152" font-size="19" fill="#5ad1e6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Une justice que même les trafiquants ne prennent plus au sérieux, selon Raufer</text><rect x="60" y="180" width="600" height="380" rx="14" fill="#5ad1e6" fill-opacity=".04" stroke="#5ad1e6" stroke-width="2"/><text x="360" y="212" font-size="18" fill="#5ad1e6" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Le cycle de l&#x27;impunité, selon Raufer</text><path d="M405 302 Q477 315 495 367" fill="none" stroke="#9fb3d6" stroke-opacity=".5" stroke-width="2.5" marker-end="url(#fl)"/><path d="M495 427 Q477 471 405 482" fill="none" stroke="#9fb3d6" stroke-opacity=".5" stroke-width="2.5" marker-end="url(#fl)"/><path d="M315 482 Q243 471 225 427" fill="none" stroke="#9fb3d6" stroke-opacity=".5" stroke-width="2.5" marker-end="url(#fl)"/><path d="M225 367 Q243 315 315 302" fill="none" stroke="#9fb3d6" stroke-opacity=".5" stroke-width="2.5" marker-end="url(#fl)"/><circle r="8" fill="#f2b84b" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M360 270 Q540 270 540 400 Q540 510 360 510 Q180 510 180 400 Q180 270 360 270"/></circle><rect x="290" y="250" width="140" height="40" rx="20" fill="#0e1228" stroke="#ff6b7a" stroke-width="2"/><text x="360" y="276" font-size="16" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Trafic</text><rect x="470" y="380" width="140" height="40" rx="20" fill="#0e1228" stroke="#7aa2ff" stroke-width="2"/><text x="540" y="406" font-size="16" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Arrestation</text><rect x="290" y="490" width="140" height="40" rx="20" fill="#0e1228" stroke="#9fb3d6" stroke-width="2"/><text x="360" y="516" font-size="16" fill="#9fb3d6" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Sortie libre</text><rect x="110" y="380" width="140" height="40" rx="20" fill="#0e1228" stroke="#f2b84b" stroke-width="2"/><text x="180" y="406" font-size="16" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Pas de peur</text><rect x="700" y="180" width="520" height="380" rx="14" fill="#f2b84b" fill-opacity=".04" stroke="#f2b84b" stroke-width="2"/><text x="960" y="212" font-size="18" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Une justice débordée</text><path d="M960 470 V270 M910 470 H1010" stroke="#9fb3d6" stroke-width="4"/><g><animateTransform attributeName="transform" type="rotate" values="0 960 270;-10 960 270;-10 960 270;0 960 270" keyTimes="0;.3;.9;1" dur="9s" repeatCount="indefinite"/><line x1="800" y1="270" x2="1120" y2="270" stroke="#9fb3d6" stroke-width="4"/><path d="M800 270 V300 M740 300 h120 l-16 20 h-88z" stroke="#7aa2ff" stroke-width="2" fill="#7aa2ff" fill-opacity=".2"/><text x="800" y="345" font-size="16" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Dossiers</text><path d="M1120 270 V300 M1060 300 h120 l-16 20 h-88z" stroke="#ff6b7a" stroke-width="2" fill="#ff6b7a" fill-opacity=".2"/><text x="1120" y="345" font-size="16" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Sanctions</text><rect x="772" y="290" width="56" height="9" rx="2" fill="#7aa2ff" fill-opacity=".7"/><rect x="772" y="279" width="56" height="9" rx="2" fill="#7aa2ff" fill-opacity=".7"/><rect x="772" y="268" width="56" height="9" rx="2" fill="#7aa2ff" fill-opacity=".7"/><rect x="772" y="257" width="56" height="9" rx="2" fill="#7aa2ff" fill-opacity=".7"/></g><text x="960" y="505" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">« Ils n&#x27;ont pas peur » :</text><text x="960" y="527" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">des annonces « pour la galerie »</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Le crime est un métier, pas un plaisir : sans sanction, il</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">continue. Raufer juge la justice laxiste et les annonces des</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">ministres purement « pour la galerie ».</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Son anecdote : des jeunes d&#x27;une cité s&#x27;étonnent qu&#x27;un cousin</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">arrêté pour trafic ressorte libre du tribunal. Les bandits, très</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">réalistes, savent ce qu&#x27;ils risquent.</text></svg>
