d6" text-anchor="middle" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">auteur<animate attributeName="opacity" values="0;0;1;.35;0" keyTimes="0;0.22;0.30;.9;1" dur="9s" repeatCount="indefinite"/></text><text x="800" y="394" font-size="19" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">drogue</text><path d="M860 388 H910" stroke="#9fb3d6" stroke-width="2" marker-end="url(#fl)"/><text x="1060" y="394" font-size="17" fill="#9fb3d6" text-anchor="middle" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">produit<animate attributeName="opacity" values="0;0;1;.35;0" keyTimes="0;0.34;0.42;.9;1" dur="9s" repeatCount="indefinite"/></text><text x="800" y="460" font-size="19" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">insécurité</text><path d="M860 454 H910" stroke="#9fb3d6" stroke-width="2" marker-end="url(#fl)"/><text x="1060" y="460" font-size="17" fill="#9fb3d6" text-anchor="middle" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">« sentiment d&#x27;insécurité »<animate attributeName="opacity" values="0;0;1;.35;0" keyTimes="0;0.46;0.54;.9;1" dur="9s" repeatCount="indefinite"/></text><text x="960" y="535" font-size="16" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">« Une langue de coton » qui brouille le réel</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Pour mesurer la violence, Raufer additionne homicides et</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">tentatives, car les SAMU sauvent aujourd&#x27;hui des blessés qui</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">seraient morts en 1980. Selon lui : +110 % en vingt ans.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Il refuse de parler de « consommateurs » pour des toxicomanes,</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">d&#x27;« auteurs » pour des malfaiteurs, ou de « sentiment</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">d&#x27;insécurité » : ces mots adouciraient le réel.</text></svg>
