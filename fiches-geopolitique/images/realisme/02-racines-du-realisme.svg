x27;Segoe UI&#x27;, system-ui, sans-serif">la mer, espace « lisse » ;</text><text x="140" y="379" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">l&#x27;État, acteur essentiel</text><circle cx="440" cy="270" r="15" fill="#0e1228" stroke="#f2b84b" stroke-width="3"/><text x="440" y="236" font-size="18" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1815</text><rect x="315" y="300" width="250" height="110" rx="14" fill="#f2b84b" fill-opacity=".08" stroke="#f2b84b" stroke-width="2"/><text x="440" y="330" font-size="18" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Congrès de Vienne</text><text x="440" y="358" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Metternich : tout ordre</text><text x="440" y="379" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">vaut mieux que le chaos</text><circle cx="740" cy="270" r="15" fill="#0e1228" stroke="#7aa2ff" stroke-width="3"/><text x="740" y="236" font-size="18" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1871-1890</text><rect x="615" y="300" width="250" height="110" rx="14" fill="#7aa2ff" fill-opacity=".08" stroke="#7aa2ff" stroke-width="2"/><text x="740" y="330" font-size="18" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Bismarck</text><text x="740" y="358" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">un réalisme</text><text x="740" y="379" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">conservateur</text><circle cx="1060" cy="270" r="15" fill="#0e1228" stroke="#ff6b7a" stroke-width="3"/><text x="1060" y="236" font-size="18" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1899-1905</text><rect x="935" y="300" width="250" height="110" rx="14" fill="#ff6b7a" fill-opacity=".08" stroke="#ff6b7a" stroke-width="2"/><text x="1060" y="330" font-size="18" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Rivalités</text><text x="1060" y="358" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Boers, Russie-Japon :</text><text x="1060" y="379" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">l&#x27;Empire contesté</text><path d="M640 540 V460 M600 540 H680" stroke="#9fb3d6" stroke-width="3"/><g><animateTransform attributeName="transform" type="rotate" values="-3 640 460;3 640 460;-3 640 460" dur="5s" repeatCount="indefinite"/><line x1="440" y1="460" x2="840" y2="460" stroke="#9fb3d6" stroke-width="3"/><circle cx="440" cy="478" r="14" fill="#7aa2ff" fill-opacity=".4" stroke="#7aa2ff"/><text x="440" y="512" font-size="14" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Puissances de terre</text><circle cx="840" cy="478" r="14" fill="#5ad1e6" fill-opacity=".4" stroke="#5ad1e6"/><text x="840" y="512" font-size="14" fill="#5ad1e6" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Puissance maritime</text></g><text x="640" y="445" font-size="16" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">L&#x27;équilibre européen du XIXe siècle</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Au XVIIe siècle, Grotius pense le droit entre États à partir de</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">la mer, espace « lisse ». L&#x27;acteur essentiel des relations</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">internationales, c&#x27;est l&#x27;État.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Au congrès de Vienne (1815), Metternich juge que tout ordre vaut</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">mieux que le chaos. Kissinger y consacre sa thèse. Le XIXe</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">siècle européen cherche l&#x27;équilibre des puissances.</text></svg>
