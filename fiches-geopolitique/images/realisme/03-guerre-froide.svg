 stroke="#7aa2ff" stroke-width="2.5"/><animateTransform attributeName="transform" type="rotate" values="0 1010 400;0 1010 400;0 1010 400;6 1010 400;6 1010 400;0 1010 400" keyTimes="0;.55;.7;.78;.95;1" dur="10s" repeatCount="indefinite"/></g><text x="1010" y="280" font-size="17" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Bloc occidental</text><text x="1010" y="304" font-size="17" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">la morale comme habit</text><text x="1010" y="328" font-size="17" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">de la puissance (thèse)</text><path d="M430 300 H850" stroke="#9fb3d6" stroke-width="3" stroke-dasharray="10 8"/><text x="640" y="288" font-size="17" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">« Paix impossible, guerre improbable » (Aron)</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.200;0.260;0.920;1" dur="10s" repeatCount="indefinite"/><rect x="470" y="330" width="340" height="90" rx="14" fill="#7ee0a0" fill-opacity=".12" stroke="#7ee0a0" stroke-width="2"/><text x="640" y="362" font-size="16" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Bandung, 1955 : les non-alignés,</text><text x="640" y="384" font-size="16" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">souveraineté et décolonisation</text></g><text x="640" y="210" font-size="16" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1945 : URSS à Bretton Woods et à l&#x27;ONU, puis la coupure</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.720;0.780;0.920;1" dur="10s" repeatCount="indefinite"/><rect x="160" y="450" width="960" height="110" rx="14" fill="#f2b84b" fill-opacity=".08" stroke="#f2b84b" stroke-width="2"/><text x="640" y="484" font-size="19" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1990 : « Nous allons vous priver d&#x27;ennemi »</text><text x="640" y="516" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Deux « planches pourries » qui se tenaient l&#x27;une l&#x27;autre : quand l&#x27;une tombe, l&#x27;autre vacille</text></g><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">En 1945, l&#x27;URSS siège à Bretton Woods et à l&#x27;ONU, puis le monde</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">se coupe en deux. Mais la décolonisation et Bandung (1955) font</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">naître un autre monde, celui des non-alignés.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Pour Rougeyron, la guerre froide (« paix impossible, guerre</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">improbable », disait Aron) a servi la puissance américaine. En</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">1990, l&#x27;URSS « prive » l&#x27;Occident de son ennemi.</text></svg>
