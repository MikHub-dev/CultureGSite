="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Pouvoir B</text></g><text x="640" y="210" font-size="19" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Deux puissances qui se retiennent</text><rect x="270" y="450" width="740" height="56" rx="14" fill="#f2b84b" fill-opacity=".1" stroke="#f2b84b" stroke-width="2"/><text x="640" y="485" font-size="19" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">« Combien de morts inutiles épargnés ? »</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.050;0.110;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="60" y="190" width="200" height="110" rx="14" fill="#5ad1e6" fill-opacity=".1" stroke="#5ad1e6" stroke-width="2"/><text x="160" y="222" font-size="17" fill="#5ad1e6" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Anarchie</text><text x="160" y="250" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">pas de pouvoir</text><text x="160" y="271" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">au-dessus des États</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.200;0.260;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="60" y="330" width="200" height="110" rx="14" fill="#7ee0a0" fill-opacity=".1" stroke="#7ee0a0" stroke-width="2"/><text x="160" y="362" font-size="17" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">L&#x27;État au centre</text><text x="160" y="390" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">acteur souverain,</text><text x="160" y="411" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">égal en dignité</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.350;0.410;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="1020" y="190" width="200" height="110" rx="14" fill="#7aa2ff" fill-opacity=".1" stroke="#7aa2ff" stroke-width="2"/><text x="1120" y="222" font-size="17" fill="#7aa2ff" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Intérêt national</text><text x="1120" y="250" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">tout État est</text><text x="1120" y="271" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">légitime à en avoir</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.500;0.560;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="1020" y="330" width="200" height="110" rx="14" fill="#ff6b7a" fill-opacity=".1" stroke="#ff6b7a" stroke-width="2"/><text x="1120" y="362" font-size="17" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Équilibre</text><text x="1120" y="390" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">seule régulation,</text><text x="1120" y="411" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">toujours précaire</text></g><text x="640" y="545" font-size="15" fill="#9fb3d6" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-style="italic">Pascal : « Plaisante justice qu&#x27;une rivière borne » ; sans frontière, on enfonce la porte du voisin</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Les principes classiques : un système international anarchique,</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">l&#x27;État souverain au centre, l&#x27;intérêt national, l&#x27;équilibre des</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">puissances, toujours précaire, comme seule régulation.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Pour Rougeyron, tous les États sont égaux en dignité, pas en</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">moyens. La puissance passe, d&#x27;où l&#x27;équilibre ; et la question</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">morale devient : combien de morts inutiles évités ?</text></svg>
