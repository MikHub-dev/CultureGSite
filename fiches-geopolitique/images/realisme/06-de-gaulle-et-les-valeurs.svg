-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">le régime soviétique passe…</text><text x="455" y="310" font-size="15" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">la Russie demeure</text><rect x="100" y="370" width="200" height="80" rx="12" fill="none" stroke="#f2b84b" stroke-width="3"/><text x="200" y="418" font-size="22" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Spectral, Georgia, &#x27;Times New Roman&#x27;, serif">Chine</text><rect x="330" y="370" width="250" height="80" rx="12" fill="#7aa2ff" fill-opacity=".2"><animate attributeName="fill" values="#7aa2ff;#5ad1e6;#7aa2ff" dur="6s" repeatCount="indefinite"/></rect><text x="455" y="406" font-size="16" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">État reconnu en 1964</text><text x="455" y="430" font-size="15" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">malgré le régime</text><text x="340" y="510" font-size="17" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">« Il n&#x27;y a pas de valeurs,</text><text x="340" y="534" font-size="17" fill="#7ee0a0" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">il y a des intérêts »</text><rect x="660" y="180" width="560" height="180" rx="14" fill="#ff6b7a" fill-opacity=".05" stroke="#ff6b7a" stroke-width="2"/><text x="940" y="212" font-size="17" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">La diplomatie des valeurs, selon Rougeyron</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.080;0.140;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="690" y="236" width="145" height="36" rx="18" fill="#ff6b7a" fill-opacity=".14" stroke="#ff6b7a"/><text x="763" y="260" font-size="17" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Ni justifier</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.260;0.320;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="849" y="236" width="126" height="36" rx="18" fill="#ff6b7a" fill-opacity=".14" stroke="#ff6b7a"/><text x="912" y="260" font-size="17" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Ni définir</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.440;0.500;0.920;1" dur="9s" repeatCount="indefinite"/><rect x="989" y="236" width="126" height="36" rx="18" fill="#ff6b7a" fill-opacity=".14" stroke="#ff6b7a"/><text x="1052" y="260" font-size="17" fill="#ff6b7a" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Ni évaluer</text></g><text x="940" y="310" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Néoconservateurs, Irak : une puissance</text><text x="940" y="331" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">qu&#x27;aucun pays n&#x27;a plus (thèse des invités)</text><rect x="660" y="380" width="560" height="180" rx="14" fill="#f2b84b" fill-opacity=".05" stroke="#f2b84b" stroke-width="2"/><text x="940" y="412" font-size="17" fill="#f2b84b" text-anchor="middle" font-weight="600" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">La puissance moyenne : le hérisson</text><g><animate attributeName="opacity" values=".6;1;.6" dur="2.5s" repeatCount="indefinite"/><line x1="760" y1="490" x2="804" y2="486" stroke="#f2b84b" stroke-width="3"/><line x1="760" y1="490" x2="801" y2="473" stroke="#f2b84b" stroke-width="3"/><line x1="760" y1="490" x2="795" y2="462" stroke="#f2b84b" stroke-width="3"/><line x1="760" y1="490" x2="785" y2="453" stroke="#f2b84b" stroke-width="3"/><line x1="760" y1="490" x2="773" y2="447" stroke="#f2b84b" stroke-width="3"/><line x1="760" y1="490" x2="760" y2="446" stroke="#f2b84b" stroke-width="3"/><line x1="760" y1="490" x2="746" y2="447" stroke="#f2b84b" stroke-width="3"/><line x1="760" y1="490" x2="734" y2="453" stroke="#f2b84b" stroke-width="3"/><line x1="760" y1="490" x2="724" y2="462" stroke="#f2b84b" stroke-width="3"/><line x1="760" y1="490" x2="718" y2="473" stroke="#f2b84b" stroke-width="3"/><line x1="760" y1="490" x2="716" y2="486" stroke="#f2b84b" stroke-width="3"/></g><ellipse cx="760" cy="494" rx="40" ry="22" fill="#0e1228" stroke="#f2b84b" stroke-width="2"/><text x="1000" y="456" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Faire payer cher toute atteinte</text><text x="1000" y="477" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">à ses intérêts ; la dissuasion</text><text x="1000" y="498" font-size="15" fill="#e6eefc" text-anchor="middle" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">nucléaire fait qu&#x27;on l&#x27;écoute</text><rect x="40" y="578" width="1200" height="118" rx="16" fill="#0a0f26" fill-opacity=".78" stroke="#5ad1e6" stroke-opacity=".35"/><line x1="640" y1="596" x2="640" y2="678" stroke="#5ad1e6" stroke-opacity=".3"/><text x="66" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">De Gaulle reconnaît les États, pas les régimes : la Russie</text><text x="66" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">survivra au système soviétique, la Chine est reconnue en 1964.</text><text x="66" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Les nations qui ont produit un État comptent.</text><text x="664" y="612" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">Pour Rougeyron, la diplomatie des valeurs n&#x27;a ni à justifier, ni</text><text x="664" y="636" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">à définir, ni à évaluer ses valeurs. Sans la puissance</text><text x="664" y="660" font-size="17" fill="#e6eefc" text-anchor="start" font-weight="400" font-family="Jost, &#x27;Segoe UI&#x27;, system-ui, sans-serif">nécessaire, elle mène l&#x27;Europe à l&#x27;impuissance.</text></svg>
