<div class="scene"><object type="image/svg+xml" data="images/realisme/03-guerre-froide.svg" aria-label="« Paix impossible, guerre improbable »">En 1945, l&#x27;URSS siège à Bretton Woods et à l&#x27;ONU, puis le monde se coupe en deux. Mais la décolonisation et Bandung (1955) font naître un autre monde, celui des non-alignés. Pour Rougeyron, la guerre froide (« paix impossible, guerre improbable », disait Aron) a servi la puissance américaine. En 1990, l&#x27;URSS « prive » l&#x27;Occident de son ennemi.</object></div>
