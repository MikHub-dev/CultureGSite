<h1 class="sr-only">Étape 4 sur 6 : « Le pouvoir arrête le pouvoir »</h1>
<div class="scene"><object type="image/svg+xml" data="images/realisme/04-principes.svg" aria-label="« Le pouvoir arrête le pouvoir »">Les principes classiques : un système international anarchique, l&#x27;État souverain au centre, l&#x27;intérêt national, l&#x27;équilibre des puissances, toujours précaire, comme seule régulation. Pour Rougeyron, tous les États sont égaux en dignité, pas en moyens. La puissance passe, d&#x27;où l&#x27;équilibre ; et la question morale devient : combien de morts inutiles évités ?</object></div>
